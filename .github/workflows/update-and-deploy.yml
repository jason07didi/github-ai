name: Update AI Radar and deploy Pages

on:
  # 可以在 Actions 页面手动运行
  workflow_dispatch:

  # 每小时第 7 分、37 分运行
  # 约每 30 分钟更新一次
  schedule:
    - cron: "7,37 * * * *"

  # 人工修改程序后自动运行
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"

permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只允许一个更新任务运行
concurrency:
  group: github-ai-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # 1. 下载仓库
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Python 环境
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ============================================================
      # 3. 缓存中文翻译模型
      # ============================================================
      - name: Cache translation model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-opus-mt-en-zh-v1
          restore-keys: |
            hf-opus-mt-en-zh-

      # ============================================================
      # 4. 安装依赖
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # 5. 更新 AI 项目
      #
      # 包括：
      # GitHub 搜索
      # 中文翻译
      # 用户友好分类
      # Star 历史
      # 项目封面图
      # ============================================================
      - name: Update GitHub projects
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TOKENIZERS_PARALLELISM: "false"
          PYTHONUNBUFFERED: "1"
        run: |
          python scripts/update.py

      # ============================================================
      # 6. Python 语法检查
      # ============================================================
      - name: Validate Python
        run: |
          python -m compileall -q scripts

      # ============================================================
      # 7. 保存本次生成的数据
      #
      # 非常重要：
      # data/*.json 都是程序自动生成的数据，
      # 不进行 git merge / rebase。
      #
      # 先把本次结果保存到临时目录。
      # ============================================================
      - name: Preserve generated data
        run: |
          rm -rf /tmp/github-ai-data
          mkdir -p /tmp/github-ai-data

          cp -a data/. /tmp/github-ai-data/

          echo "Generated data preserved."
          ls -lah /tmp/github-ai-data

      # ============================================================
      # 8. 同步最新 main，再覆盖自动生成的数据
      #
      # 这样即使 Action 运行期间，
      # 你修改了 index.html / Python / workflow，
      # 也不会再发生 JSON merge conflict。
      # ============================================================
      - name: Commit refreshed data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "ai-tools-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "Fetching latest main..."
          git fetch origin main

          echo "Resetting workspace to latest remote main..."
          git reset --hard origin/main

          echo "Restoring newly generated data..."
          rm -rf data
          mkdir -p data
          cp -a /tmp/github-ai-data/. data/

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: refresh AI tools data"

            echo "Pushing refreshed data..."

            if ! git push origin HEAD:main; then

              echo "Remote changed while pushing."
              echo "Refreshing remote branch and retrying once..."

              git fetch origin main
              git reset --hard origin/main

              rm -rf data
              mkdir -p data
              cp -a /tmp/github-ai-data/. data/

              git add data/

              if ! git diff --cached --quiet; then
                git commit -m "chore: refresh AI tools data"
              fi

              git push origin HEAD:main
            fi
          fi

      # ============================================================
      # 9. 准备网站文件
      # ============================================================
      - name: Prepare static site
        run: |
          rm -rf _site
          mkdir -p _site

          cp index.html _site/
          cp .nojekyll _site/

          cp -R assets _site/
          cp -R data _site/

          echo "Static site ready."

          find _site -maxdepth 2 -type f | sort | head -100

      # ============================================================
      # 10. 配置 GitHub Pages
      # ============================================================
      - name: Configure Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 11. 上传网站
      # ============================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      # ============================================================
      # 12. 发布网站
      # ============================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
